            - DateTimeField
            - DictionaryField
            - EmailField
            - ExpressionField
            - FileField
            - GenericField
            - HiddenField
            - ImageField
            - LabelField
            - LocationDistanceField
            - LocationField
            - LookupField
            - MultiReferenceField
            - MultiSelectField
            - NumberField
            - ObjectField
            - PasswordField
            - PhoneField
            - PostalCodeField
            - ReferenceField
            - RelatedObjectsField
            - SelectField
            - TagsField
            - TextField
            - TimeField
            - UrlField
          type: string
        Description:
          title: Description
          type: string
        ApiName:
          title: ApiName
          type: string
        DefaultValue:
          title: Default Value
        IsRequired:
          title: Required?
          type: boolean
        Options:
          $ref: '#/components/schemas/FieldOptions'
      description: Form Field
      discriminator:
        propertyName: _t
        mapping:
          AddressField: '#/components/schemas/AddressField'
          ArrayField: '#/components/schemas/ArrayField'
          CheckboxField: '#/components/schemas/CheckboxField'
          ChildrenField: '#/components/schemas/ChildrenField'
          DateField: '#/components/schemas/DateField'
          DateRangeField: '#/components/schemas/DateRangeField'
          DateTimeField: '#/components/schemas/DateTimeField'
          DictionaryField: '#/components/schemas/DictionaryField'
          EmailField: '#/components/schemas/EmailField'
          FileField: '#/components/schemas/FileField'
          GenericField: '#/components/schemas/GenericField'
          HiddenField: '#/components/schemas/HiddenField'
          LabelField: '#/components/schemas/LabelField'
          MultiReferenceField: '#/components/schemas/MultiReferenceField'
          MultiSelectField: '#/components/schemas/MultiSelectField'
          NumberField: '#/components/schemas/NumberField'
          ObjectField: '#/components/schemas/ObjectField'
