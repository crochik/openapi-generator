  '/google/api/AppPlaces({id})':
    get:
      tags:
        - google
      description: GetPlace
      operationId: GetGooglePlace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            title: id
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: Google Place Address
                type: object
                properties:
                  formattedAddress:
                    title: formattedAddress
                    type: string
                  streetNumber:
                    title: streetNumber
                    type: string
                  street:
                    title: street
                    type: string
                  neighborhood:
                    title: neighborhood
                    type: string
                  city:
                    title: city
                    type: string
                  state:
                    title: state
                    type: string
                  county:
                    title: county
                    type: string
                  country:
                    title: country
                    type: string
                  postalCode:
                    title: postalCode
                    type: string
                  postalCodeSuffix:
                    title: postalCodeSuffix
                    type: string
                  coordinates:
                    $ref: '#/components/schemas/GeoJSONPoint'
                  components:
                    title: components
                    type: object
                    additionalProperties:
                      type: string
                description: Google Place Address
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
        - ProductionIDP:
            - rest
          TestIDP:
            - rest
