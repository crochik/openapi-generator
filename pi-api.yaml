components:
  schemas:
    api-pi-response-error:
      title: API Error
      type: object
      properties:
        statusCode:
          title: Http Status Code
          maximum: 600
          minimum: 300
          type: integer
          description: HTTP Response Status Code
        message:
          title: Error Message
          type: string
          description: API Error Message
        success:
          title: Success
          type: boolean
          description: Whether the request was successful. Always false
          default: false
      description: 'System: Response Body on API Error'
    api-pi-condition-operator:
      title: Condition Operator
      enum:
        - Eq
        - Gt
        - Gte
        - In
        - Lt
        - Lte
        - Ne
        - Nin
      type: string
      description: 'System: Condition Operator'
      x-enum-varnames:
        - Equal
        - GreaterThan
        - GreaterThanOrEqual
        - In
        - LessThan
        - LessThanOrEqual
        - NotEqual
        - NotIn
      x-enum-descriptions:
        - Equal
        - Greater Than
        - Greater Than Or Equal
        - In
        - Less Than
        - Less Than Or Equal
        - Not Equal
        - Not In
    api-pi-action-response:
      title: Object Action Response
      type: object
      properties:
        message:
          title: Error Message
          type: string
          description: Error Message
        success:
          title: Success
          type: boolean
          description: Whether the action was initiated successfully or not
        nextUrl:
          title: Next URL
          type: string
          description: Url to be launched next
          format: uri
        runId:
          title: Run Id
          type: string
          description: 'Id of the flow run initiated by this action, if any.'
          format: uuid
      description: Response to initiating an Object Action
    DateRangePreset:
      title: Date Range Preset
      required:
        - Range
      type: object
      properties:
        Name:
          title: Name
          type: string
        Range:
          title: Range
          type: string
      description: Date Range Preset
    Condition:
      title: Filter Condition
      required:
        - FieldName
        - Operator
        - Value
      type: object
      properties:
        FieldName:
          title: Field Name
        Operator:
          title: Operator
          enum:
            - Eq
            - Gt
            - Gte
            - In
            - Lt
            - Lte
            - Ne
            - Nin
          type: string
        Value:
          title: Value
      description: Filter Condition
    UIElement:
      title: base for UI objects
      required:
        - Name
      type: object
      properties:
        Name:
          title: Name
          type: string
        Label:
          title: Label
          type: string
        Enable:
          title: Enable
        Visible:
          title: Visible
      description: base for UI objects
    FieldOptions:
      title: Base type for field options
      required:
        - _t
      type: object
      properties:
        _t:
          title: Type
          enum:
            - AddressFieldOptions
            - ArrayFieldOptions
            - BitwiseFlagFieldOptions
            - CheckboxFieldOptions
            - ChildrenFieldOptions
            - DateRangeFieldOptions
            - DictionaryFieldOptions
            - EmailFieldOptions
            - FileFieldOptions
            - GenericFieldOptions
            - HiddenFieldOptions
            - LabelFieldOptions
            - LookupFieldOptions
            - MultiReferenceFieldOptions
            - MultiSelectFieldOptions
            - NumberFieldOptions
            - ObjectFieldOptions
            - PasswordFieldOptions
            - PhoneFieldOptions
            - PostalCodeFieldOptions
            - ReferenceFieldOptions
            - RelatedObjectsFieldOptions
            - SelectFieldOptions
            - TagsFieldOptions
            - TextFieldOptions
            - TimeFieldOptions
            - UrlFieldOptions
          type: string
        LinkUrl:
          title: Link Url
          type: string
        LinkLabel:
          title: Link Label
          type: string
      description: Base type for field options
      discriminator:
        propertyName: _t
        mapping:
          ArrayFieldOptions: '#/components/schemas/ArrayFieldOptions'
          CheckboxFieldOptions: '#/components/schemas/CheckboxFieldOptions'
          ChildrenFieldOptions: '#/components/schemas/ChildrenFieldOptions'
          DateRangeFieldOptions: '#/components/schemas/DateRangeFieldOptions'
          DictionaryFieldOptions: '#/components/schemas/DictionaryFieldOptions'
          FileFieldOptions: '#/components/schemas/FileFieldOptions'
          GenericFieldOptions: '#/components/schemas/GenericFieldOptions'
          HiddenFieldOptions: '#/components/schemas/HiddenFieldOptions'
          LabelFieldOptions: '#/components/schemas/LabelFieldOptions'
          MultiReferenceFieldOptions: '#/components/schemas/MultiReferenceFieldOptions'
          MultiSelectFieldOptions: '#/components/schemas/MultiSelectFieldOptions'
          NumberFieldOptions: '#/components/schemas/NumberFieldOptions'
          ObjectFieldOptions: '#/components/schemas/ObjectFieldOptions'
          PasswordFieldOptions: '#/components/schemas/PasswordFieldOptions'
          PhoneFieldOptions: '#/components/schemas/PhoneFieldOptions'
          PostalCodeFieldOptions: '#/components/schemas/PostalCodeFieldOptions'
          ReferenceFieldOptions: '#/components/schemas/ReferenceFieldOptions'
          SelectFieldOptions: '#/components/schemas/SelectFieldOptions'
          TagsFieldOptions: '#/components/schemas/TagsFieldOptions'
          TextFieldOptions: '#/components/schemas/TextFieldOptions'
          TimeFieldOptions: '#/components/schemas/TimeFieldOptions'
          UrlFieldOptions: '#/components/schemas/UrlFieldOptions'
          LookupFieldOptions: '#/components/schemas/LookupFieldOptions'
          RelatedObjectsFieldOptions: '#/components/schemas/RelatedObjectsFieldOptions'
          BitwiseFlagFieldOptions: '#/components/schemas/BitwiseFlagFieldOptions'
    MenuItem:
      title: Menu Item
