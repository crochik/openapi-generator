      parameters:
        - name: search
          in: query
          schema:
            title: search
            type: string
        - name: center
          in: query
          schema:
            title: center
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: Address Prediction Response
                type: object
                properties:
